[package]
name = "glyphio-server"
version = "0.1.0"
edition = "2021"
description = "Glyphio reference sync backend: implements the v1 wire protocol (sync-proto) over HTTP. Self-hostable (SQLite) or AWS-serverless (DynamoDB)."
license = "Apache-2.0"

# Standalone workspace — deliberately NOT a member of src-tauri's workspace so the app and the
# server build/ship independently.
[workspace]

[dependencies]
sync-proto = { path = "../src-tauri/crates/sync-proto" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# auth
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
subtle = "2"
hex = "0.4"
rand = "0.8"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
