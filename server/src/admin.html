<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyphio — Admin</title>
<style>
  :root{
    --bg:#0b0c0f; --surface:#14161a; --surface-2:#1b1e24; --inset:#0f1114;
    --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.12);
    --text:#ecedef; --text-2:#a6aab2; --muted:#64686f;
    --accent:#d9a54a; --accent-hover:#e6b65f; --accent-on:#171208;
    --bar:#ba852c; /* chart mark: brass step validated for the dark surface */
    --danger:#e07070; --ok:#86c07a;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
  nav{border-right:1px solid var(--border);padding:24px 14px;background:var(--surface);
    display:flex;flex-direction:column}
  .brand{font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
    padding:0 10px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .brand b{color:var(--accent)}
  .navbtn{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text-2);
    font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px}
  .navbtn:hover{color:var(--text);background:var(--surface-2)}
  .navbtn.active{color:var(--accent);background:var(--surface-2);font-weight:600}
  .whoami{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border);
    color:var(--muted);font-size:12px;word-break:break-all}
  .whoami button{margin-top:8px;width:100%}
  main{padding:32px 36px;max-width:1120px}
  h2{font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);
    font-weight:600;margin:0 0 18px;display:flex;align-items:center;gap:12px}
  h2 .crumb{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
  .back{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0}
  .back:hover{color:var(--accent-hover)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:20px;margin-bottom:16px}
  label{display:block;color:var(--text-2);font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;margin-bottom:6px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input,select{background:var(--inset);color:var(--text);border:1px solid var(--border-strong);
    border-radius:6px;padding:8px 12px;font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input.search{min-width:260px}
  button{background:var(--accent);color:var(--accent-on);border:0;border-radius:6px;
    padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--accent-hover)}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:transparent;color:var(--text-2);border:1px solid var(--border-strong)}
  button.ghost:hover{color:var(--text);border-color:var(--accent)}
  button.danger{background:transparent;color:var(--danger);border:1px solid var(--border-strong);padding:5px 10px}
  button.danger:hover{border-color:var(--danger)}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  table{width:100%;border-collapse:collapse}
  th{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border-strong)}
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  td.strong{font-weight:600}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--surface-2)}
  .dim{color:var(--text-2)} .dimmer{color:var(--muted);font-size:12px}
  .mono{font-family:var(--mono);font-size:12px}
  .pill{display:inline-block;border:1px solid var(--border-strong);border-radius:999px;
    padding:1px 10px;font-size:12px;color:var(--text-2)}
  .pill.owner,.pill.admin{color:var(--accent);border-color:var(--accent)}
  .pill.archived{color:var(--danger)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
  .stat .n{font-size:26px;font-weight:700;color:var(--accent);line-height:1.2}
  .stat .l{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .empty{color:var(--muted);padding:12px 2px}
  .spin{color:var(--muted);padding:12px 2px}
  #status{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;
    padding:10px 18px;font-size:13px;display:none;max-width:80vw;z-index:9}
  #status.err{color:var(--danger)} #status.ok{color:var(--ok)}
  #gate{max-width:520px;margin:14vh auto 0;padding:0 24px}
  #gate .brand{border:0;text-align:center;font-size:18px;padding-bottom:8px}
  #gate .sso{width:100%;padding:11px;font-size:14px}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;margin:16px 0}
  .or::before,.or::after{content:"";flex:1;border-top:1px solid var(--border)}
  [hidden]{display:none !important}
  form.orgform .row{margin-bottom:14px}
  /* activity chart */
  .chart-wrap{position:relative}
  .chart-wrap svg{display:block;width:100%;height:150px}
  .chart-bar{fill:var(--bar)}
  .chart-bar:hover,.chart-bar.hot{fill:var(--accent)}
  .chart-grid{stroke:var(--border-strong);stroke-width:1}
  .chart-ylab,.chart-xlab{fill:var(--muted);font-size:10px}
  .chart-maxlab{fill:var(--text-2);font-size:10px}
  #tooltip{position:fixed;pointer-events:none;background:var(--surface-2);
    border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:12px;
    color:var(--text);display:none;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #tooltip .t-day{color:var(--muted);margin-bottom:2px}
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="brand">Glyph<b>io</b> admin</div>
  <div class="card" id="sso-card" hidden>
    <button class="sso" id="sso">Sign in with SSO</button>
    <p class="hint">Authorization Code + PKCE in this browser. The token stays in this tab's session.</p>
  </div>
  <div class="or" id="gate-or" hidden>or paste a token</div>
  <div class="card">
    <label for="token">Bearer token</label>
    <div class="row">
      <input type="password" id="token" style="flex:1" placeholder="admin/owner token (OIDC ID token or static token)" autocomplete="off">
      <button id="connect">Connect</button>
    </div>
    <p class="hint">Kept in this tab's memory only — nothing is stored.</p>
  </div>
  <p class="hint" id="gate-msg"></p>
</div>

<div class="shell" id="shell" hidden>
  <nav>
    <div class="brand">Glyph<b>io</b></div>
    <button class="navbtn" data-view="overview">Overview</button>
    <button class="navbtn" data-view="teams">Teams</button>
    <button class="navbtn" data-view="members">Members</button>
    <button class="navbtn" data-view="audit" id="nav-audit">Audit</button>
    <button class="navbtn" data-view="org" id="nav-org">Org settings</button>
    <div class="whoami"><span id="whoami"></span><button class="ghost" id="signout">Sign out</button></div>
  </nav>
  <main id="main"></main>
</div>
<div id="status"></div>
<div id="tooltip"></div>

<script>
"use strict";
const ROLES = ["reader","writer","manager","admin","owner"];
const rank = r => ROLES.indexOf(r);
let token = "", me = null, myTeams = [], view = "overview";
const SESSION_KEY = "glyphio.admin.session";
const PKCE_KEY = "glyphio.admin.pkce";

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const api = async (path, opts = {}) => {
  const res = await fetch(path, { ...opts,
    headers: { "Authorization": "Bearer " + token,
               ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  if (res.status === 401) { signOut(false); throw new Error("session expired — sign in again"); }
  if (!res.ok) {
    let d = res.status + " " + res.statusText;
    try { const p = await res.json(); d = p.detail || p.title || d; } catch {}
    throw new Error(d);
  }
  return res.json();
};

let statusTimer;
function toast(msg, cls) {
  const s = $("#status");
  s.textContent = msg; s.className = cls; s.style.display = "block";
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => s.style.display = "none", 4200);
}

const isOwner = () => myTeams.some(t => t.role === "owner");
const isAdmin = () => myTeams.some(t => rank(t.role) >= rank("admin"));

// ---- sign-in: OIDC (Authorization Code + PKCE, browser-side) or token paste ----------

const b64url = bytes => btoa(String.fromCharCode(...bytes))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const randUrl = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
async function s256(text) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return b64url(new Uint8Array(digest));
}
const jwtPayload = t => {
  try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); }
  catch { return null; }
};

async function oidcStart() {
  try {
    const cfg = await fetch("/admin/v1/config").then(r => r.json());
    const issuer = cfg.issuer.replace(/\/$/, "");
    const disc = await fetch(issuer + "/.well-known/openid-configuration").then(r => r.json());
    const verifier = randUrl(48), state = randUrl(12), nonce = randUrl(12);
    sessionStorage.setItem(PKCE_KEY, JSON.stringify({
      verifier, state, nonce,
      tokenEndpoint: disc.token_endpoint, clientId: cfg.clientId,
    }));
    const p = new URLSearchParams({
      response_type: "code",
      client_id: cfg.clientId,
      redirect_uri: location.origin + "/admin",
      scope: cfg.scopes || "openid profile email",
      state, nonce,
      code_challenge: await s256(verifier),
      code_challenge_method: "S256",
    });
    location.href = disc.authorization_endpoint + "?" + p;
  } catch (e) { toast("SSO start failed: " + e.message, "err"); }
}

// Handles the ?code=… return leg. Returns the ID token, or null if this isn't a return.
async function oidcComplete() {
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  if (!code) {
    if (q.get("error")) toast("SSO failed: " + (q.get("error_description") || q.get("error")), "err");
    return null;
  }
  const saved = JSON.parse(sessionStorage.getItem(PKCE_KEY) || "null");
  sessionStorage.removeItem(PKCE_KEY);
  history.replaceState({}, "", "/admin"); // never leave the code in the URL/history
  if (!saved || q.get("state") !== saved.state) {
    toast("SSO failed: state mismatch — try again.", "err");
    return null;
  }
  const res = await fetch(saved.tokenEndpoint, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      grant_type: "authorization_code",
      code,
      redirect_uri: location.origin + "/admin",
      client_id: saved.clientId,
      code_verifier: saved.verifier,
    }),
  });
  if (!res.ok) {
    toast("SSO token exchange failed (" + res.status + ") — is the console client registered as a public SPA client with CORS?", "err");
    return null;
  }
  const tokens = await res.json();
  const idToken = tokens.id_token;
  const claims = idToken && jwtPayload(idToken);
  if (!claims || (saved.nonce && claims.nonce && claims.nonce !== saved.nonce)) {
    toast("SSO failed: bad ID token.", "err");
    return null;
  }
  // The server re-validates signature/issuer/audience/expiry on every request; the
  // session copy here is only a convenience cache for this tab.
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ token: idToken, exp: claims.exp || 0 }));
  return idToken;
}

function savedSession() {
  const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
  if (s && s.exp && s.exp * 1000 > Date.now() + 60_000) return s.token;
  sessionStorage.removeItem(SESSION_KEY);
  return null;
}

function signOut(navigate = true) {
  sessionStorage.removeItem(SESSION_KEY);
  token = ""; me = null; myTeams = [];
  if (navigate) location.replace("/admin");
}

async function boot() {
  const cfg = await fetch("/admin/v1/config").then(r => r.json()).catch(() => ({ oidcEnabled: false }));
  $("#sso-card").hidden = !cfg.oidcEnabled;
  $("#gate-or").hidden = !cfg.oidcEnabled;

  const fromRedirect = await oidcComplete().catch(e => { toast("SSO failed: " + e.message, "err"); return null; });
  const t = fromRedirect || savedSession();
  if (t) {
    token = t;
    const ok = await connectWith(t);
    if (ok) return;
  }
  $("#gate").hidden = false;
}

async function connectWith(t) {
  token = t;
  try {
    [me, myTeams] = await Promise.all([api("/v1/me"), api("/admin/v1/teams")]);
    $("#gate").hidden = true;
    $("#shell").hidden = false;
    $("#whoami").textContent = me.sub + (me.email ? " · " + me.email : "");
    $("#nav-org").hidden = !isOwner();
    $("#nav-audit").hidden = !isAdmin() && !isOwner();
    show("overview");
    return true;
  } catch (e) {
    toast("Connect failed: " + e.message, "err");
    $("#gate").hidden = false;
    return false;
  }
}

$("#sso").addEventListener("click", oidcStart);
$("#signout").addEventListener("click", () => signOut());
$("#connect").addEventListener("click", () => {
  const t = $("#token").value.trim();
  if (!t) return toast("Paste a token first.", "err");
  connectWith(t).then(ok => { if (ok) toast("Connected.", "ok"); });
});
$("#token").addEventListener("keydown", e => { if (e.key === "Enter") $("#connect").click(); });

boot();

// ---- navigation ------------------------------------------------------------------

document.querySelectorAll(".navbtn").forEach(b =>
  b.addEventListener("click", () => show(b.dataset.view)));

const VIEWS = {
  overview: () => overview(),
  teams: () => teams(),
  team: arg => teamDetail(arg),
  members: () => members(),
  member: arg => memberDetail(arg),
  org: () => org(),
  audit: () => audit(),
};

function show(v, arg) {
  view = v;
  const navFor = { team: "teams", member: "members" }[v] || v;
  document.querySelectorAll(".navbtn").forEach(b =>
    b.classList.toggle("active", b.dataset.view === navFor));
  const main = $("#main");
  main.innerHTML = "";
  main.appendChild(el("div", "spin", "Loading…"));
  VIEWS[v](arg).catch(e => {
    main.innerHTML = "";
    main.appendChild(el("div", "empty", "Failed to load: " + e.message));
  });
}

async function refreshTeams() { myTeams = await api("/admin/v1/teams"); }

function heading(text, backView, crumb) {
  const h = el("h2");
  if (backView) {
    const b = el("button", "back", "‹ " + backView[1]);
    b.addEventListener("click", () => show(backView[0]));
    h.appendChild(b);
  }
  h.appendChild(document.createTextNode(text));
  if (crumb) h.appendChild(el("span", "crumb", crumb));
  return h;
}

// ---- overview ------------------------------------------------------------------

async function overview() {
  const stats = await api("/admin/v1/stats");
  const totalMembers = new Set();
  // Cross-team unique members need rosters; team counters cover per-team uniqueness.
  const rosters = await Promise.all(stats.teams.map(t =>
    api(`/v1/teams/${encodeURIComponent(t.team)}/members`).catch(() => ({ members: [] }))));
  rosters.forEach(r => r.members.forEach(m => totalMembers.add(m.sub)));
  const events30 = stats.activity.reduce((n, d) => n + d.pushes + d.roles + d.invites + d.other, 0);

  const main = $("#main");
  main.innerHTML = "";
  main.appendChild(heading("Overview"));
  const tiles = el("div", "stats");
  const stat = (n, l) => {
    const s = el("div", "stat");
    s.appendChild(el("div", "n", String(n)));
    s.appendChild(el("div", "l", l));
    return s;
  };
  tiles.appendChild(stat(stats.teams.filter(t => !t.archived).length, "teams"));
  tiles.appendChild(stat(totalMembers.size, "members"));
  if (stats.activity.length || isAdmin() || isOwner()) tiles.appendChild(stat(events30, "events · 30 days"));
  main.appendChild(tiles);

  if (stats.activity.length) {
    const card = el("div", "card");
    card.appendChild(el("label", null, "Activity — last 30 days"));
    card.appendChild(activityChart(stats.activity));
    main.appendChild(card);
  }

  if (isOwner() || isAdmin()) {
    const card = el("div", "card");
    card.appendChild(el("label", null, "Recent activity"));
    try {
      const entries = await api("/admin/v1/audit?limit=8");
      card.appendChild(auditTable(entries));
    } catch (e) { card.appendChild(el("p", "empty", "Audit unavailable: " + e.message)); }
    main.appendChild(card);
  }
}

// Daily event counts as a single-series bar chart (SVG, hover tooltip with the
// per-category breakdown; the max bar is direct-labeled).
function activityChart(activity) {
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    const row = activity.find(a => a.day === d);
    days.push(row || { day: d, pushes: 0, roles: 0, invites: 0, other: 0 });
  }
  const total = d => d.pushes + d.roles + d.invites + d.other;
  const max = Math.max(1, ...days.map(total));

  const W = 960, H = 150, padL = 30, padB = 18, padT = 14;
  const plotW = W - padL - 6, plotH = H - padT - padB;
  const bw = plotW / days.length;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Daily admin/sync events over the last 30 days");

  // Recessive grid: baseline + one reference line at the max.
  for (const [y, lab] of [[padT, String(max)], [padT + plotH, "0"]]) {
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", padL); line.setAttribute("x2", W - 6);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("class", "chart-grid");
    svg.appendChild(line);
    const t = document.createElementNS(svgNS, "text");
    t.setAttribute("x", padL - 6); t.setAttribute("y", y + 3);
    t.setAttribute("text-anchor", "end");
    t.setAttribute("class", "chart-ylab");
    t.textContent = lab;
    svg.appendChild(t);
  }

  const tooltip = $("#tooltip");
  const maxIdx = days.reduce((best, d, i) => total(d) > total(days[best]) ? i : best, 0);
  days.forEach((d, i) => {
    const n = total(d);
    const h = Math.round((n / max) * plotH);
    const x = padL + i * bw + 1;
    const y = padT + plotH - h;
    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("x", x); rect.setAttribute("width", Math.max(2, bw - 2));
    // Rounded top on data end, square at the baseline: clip a slightly taller rect.
    rect.setAttribute("y", y); rect.setAttribute("height", Math.max(n > 0 ? 2 : 0, h));
    rect.setAttribute("rx", 2);
    rect.setAttribute("class", "chart-bar");
    rect.addEventListener("mousemove", ev => {
      tooltip.style.display = "block";
      tooltip.style.left = Math.min(ev.clientX + 14, innerWidth - 220) + "px";
      tooltip.style.top = (ev.clientY + 14) + "px";
      tooltip.innerHTML = `<div class="t-day">${esc(d.day)}</div>` +
        `<b>${n}</b> event${n === 1 ? "" : "s"}` +
        (n ? `<br><span class="dim">${d.pushes} pushes · ${d.roles} roles · ${d.invites} invites · ${d.other} other</span>` : "");
    });
    rect.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
    svg.appendChild(rect);
    if (i === maxIdx && n > 0) {
      const t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", x + bw / 2); t.setAttribute("y", y - 4);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("class", "chart-maxlab");
      t.textContent = String(n);
      svg.appendChild(t);
    }
    if (i % 7 === 0) {
      const t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", x); t.setAttribute("y", H - 4);
      t.setAttribute("class", "chart-xlab");
      t.textContent = d.day.slice(5);
      svg.appendChild(t);
    }
  });

  const wrap = el("div", "chart-wrap");
  wrap.appendChild(svg);
  return wrap;
}

// ---- teams (list → detail) --------------------------------------------------------

async function teams() {
  const [, stats] = await Promise.all([refreshTeams(), api("/admin/v1/stats").catch(() => ({ teams: [] }))]);
  const counts = new Map(stats.teams.map(t => [t.team, t]));
  const main = $("#main");
  main.innerHTML = "";
  main.appendChild(heading("Teams"));

  const card = el("div", "card");
  const top = el("div", "row");
  const search = el("input", "search"); search.placeholder = "Filter teams…";
  const inp = el("input"); inp.placeholder = "new-team-name"; inp.maxLength = 64;
  const btn = el("button", null, "Create team");
  btn.addEventListener("click", async () => {
    const name = inp.value.trim();
    if (!name) return;
    try {
      await api("/admin/v1/teams", { method: "POST", body: JSON.stringify({ team: name }) });
      toast(`Team ${name} created — you are its owner.`, "ok");
      show("team", name);
    } catch (e) { toast("Create failed: " + e.message, "err"); }
  });
  top.appendChild(search);
  top.appendChild(el("span")).style.flex = "1";
  top.appendChild(inp); top.appendChild(btn);
  card.appendChild(top);

  const table = el("table");
  table.innerHTML = `<thead><tr><th>Team</th><th>Members</th><th>Your role</th></tr></thead>`;
  const tb = el("tbody");

async function rosterCard(t, refresh) {
  const card = el("div", "card");
  card.appendChild(el("label", null, "Roster"));
  try {
    const [rows, mem] = await Promise.all([
      api(`/admin/v1/teams/${encodeURIComponent(t.team)}/roles`),
      api(`/v1/teams/${encodeURIComponent(t.team)}/members`),
    ]);
    const bySub = new Map();
    for (const m of mem.members) bySub.set(m.sub, { ...m });
    for (const r of rows) bySub.set(r.sub, { ...(bySub.get(r.sub) || { sub: r.sub }), role: r.role });
    card.appendChild(rosterTable(t, [...bySub.values()].sort((a, b) => a.sub.localeCompare(b.sub)), refresh));
  } catch (e) { card.appendChild(el("p", "empty", "Failed: " + e.message)); }

  // Add member by sub — manager+ (their grant ceiling; the server enforces it regardless).
  const ceiling = t.role === "owner" ? "owner" : t.role === "admin" ? "manager" : "writer";
  const add = el("div", "row"); add.style.marginTop = "12px";
  const sub = el("input"); sub.placeholder = "add member by sub (identity)"; sub.style.flex = "1";
  const sel = el("select");
  for (const r of ROLES) if (rank(r) <= rank(ceiling)) sel.append(new Option(r, r));
  sel.value = "reader";
  const btn = el("button", null, "Add / set role");
  btn.addEventListener("click", async () => {
    const s = sub.value.trim();
    if (!s) return;
    try {
      await api(`/admin/v1/teams/${encodeURIComponent(t.team)}/roles/${encodeURIComponent(s)}`,
        { method: "PUT", body: JSON.stringify({ role: sel.value }) });
      toast(`${s} → ${sel.value}.`, "ok"); sub.value = ""; refresh();
    } catch (e) { toast("Failed: " + e.message, "err"); }
  });
  add.appendChild(sub); add.appendChild(sel); add.appendChild(btn);
  card.appendChild(add);

  card.appendChild(inviteSection(t));

  if (t.role === "owner") {
    const arch = el("div", "row"); arch.style.marginTop = "14px";
    const b = el("button", "danger", "Archive team");
    b.addEventListener("click", async () => {
      if (!confirm(`Archive ${t.team}? Data is kept; sync stops; re-create with the same name to revive.`)) return;
      try {
        await api(`/admin/v1/teams/${encodeURIComponent(t.team)}`, { method: "DELETE" });
        toast(`${t.team} archived.`, "ok");
        show("teams");
      } catch (e) { toast("Archive failed: " + e.message, "err"); }
    });
    arch.appendChild(b);
    card.appendChild(arch);
  }
  return card;
}

function rosterTable(t, people, refresh) {
  const table = el("table");
  table.innerHTML = `<thead><tr><th>Member</th><th>Last seen</th><th>Role</th><th></th></tr></thead>`;
  const tb = el("tbody");
  const myRank = rank(t.role);
  const assignCeiling = t.role === "owner" ? rank("owner")
                      : t.role === "admin" ? rank("manager") : rank("writer");
  for (const p of people) {
    const tr = el("tr");
    const who = el("td", "strong");
    who.innerHTML = `<span class="click" style="cursor:pointer">${esc(p.sub)}</span>` +
      (p.email ? ` <span class="dim">· ${esc(p.email)}</span>` : "");
    who.firstChild.addEventListener("click", () => show("member", p.sub));
    tr.appendChild(who);
    const seen = el("td");
    seen.innerHTML = `<span class="dimmer">${p.lastSeen ? new Date(p.lastSeen).toLocaleString() : "—"}</span>`;
    tr.appendChild(seen);

    const targetRank = p.role ? rank(p.role) : -1;
    const canTouch = p.sub !== me.sub &&
      (t.role === "owner" || (targetRank <= assignCeiling && myRank > targetRank));

    const roleTd = el("td");
    if (canTouch) {
      const sel = el("select");
      sel.append(new Option("default", ""));
      for (const r of ROLES) if (rank(r) <= assignCeiling) sel.append(new Option(r, r));
      sel.value = p.role || "";
      sel.addEventListener("change", async () => {
        const url = `/admin/v1/teams/${encodeURIComponent(t.team)}/roles/${encodeURIComponent(p.sub)}`;
        try {
          if (sel.value === "") await api(url, { method: "DELETE" });
          else await api(url, { method: "PUT", body: JSON.stringify({ role: sel.value }) });
          toast(`${p.sub} → ${sel.value || "default"}.`, "ok"); refresh();
        } catch (e) { toast("Change failed: " + e.message, "err"); refresh(); }
      });
      roleTd.appendChild(sel);
    } else {
      roleTd.innerHTML = `<span class="pill ${p.role || ""}">${p.role || "default"}</span>`;
    }
    tr.appendChild(roleTd);

    const act = el("td");
    if (canTouch && p.role) {
      const rm = el("button", "danger", "remove role");
      rm.title = "Remove the explicit role row (falls back to the default role)";
      rm.addEventListener("click", async () => {
        try {
          await api(`/admin/v1/teams/${encodeURIComponent(t.team)}/roles/${encodeURIComponent(p.sub)}`, { method: "DELETE" });
          toast(`Removed role row for ${p.sub}.`, "ok"); refresh();
        } catch (e) { toast("Remove failed: " + e.message, "err"); }
      });
      act.appendChild(rm);
    }
    if (canTouch) {
      const rv = el("button", "danger", "revoke access");
      rv.title = "Revoke this member's invite tokens for the team and remove their role row";
      rv.style.marginLeft = "6px";
      rv.addEventListener("click", async () => {
        if (!confirm(`Revoke ${p.sub}'s access to ${t.team}? Their invite tokens for this team stop working.`)) return;
        try {
          await api(`/admin/v1/teams/${encodeURIComponent(t.team)}/access/${encodeURIComponent(p.sub)}`, { method: "DELETE" });
          toast(`Access revoked for ${p.sub}.`, "ok"); refresh();
        } catch (e) { toast("Revoke failed: " + e.message, "err"); }
      });
      act.appendChild(rv);
    }
    tr.appendChild(act);
    tb.appendChild(tr);
  }
  if (!people.length) tb.innerHTML = `<tr><td colspan="4" class="empty">No members seen yet.</td></tr>`;
  table.appendChild(tb);
  return table;
}

function inviteSection(t) {
  const wrap = el("div");
  wrap.style.marginTop = "18px";
  wrap.appendChild(el("label", null, "Invite member"));
  const row = el("div", "row");
  const sub = el("input"); sub.placeholder = "sub (identity)"; sub.style.flex = "1";
  const email = el("input"); email.placeholder = "email (optional)";
  const role = el("select");
  role.append(new Option("default role", ""));
  const ceiling = t.role === "owner" ? "admin" : t.role === "admin" ? "manager" : "writer";
  for (const r of ROLES) if (rank(r) <= rank(ceiling)) role.append(new Option(r, r));
  const days = el("input"); days.type = "number"; days.min = 1; days.max = 3650;
  days.placeholder = "expiry (days)"; days.style.width = "110px";
  const btn = el("button", null, "Create invite");
  row.appendChild(sub); row.appendChild(email); row.appendChild(role); row.appendChild(days); row.appendChild(btn);
  wrap.appendChild(row);
  const out = el("div"); out.style.marginTop = "10px";
  wrap.appendChild(out);

  btn.addEventListener("click", async () => {
    const s = sub.value.trim();
    if (!s) return toast("Enter a sub (identity) first.", "err");
    const body = { sub: s };
    if (email.value.trim()) body.email = email.value.trim();
    if (role.value) body.role = role.value;
    if (days.value) body.expiresDays = parseInt(days.value, 10);
    try {
      const inv = await api(`/admin/v1/teams/${encodeURIComponent(t.team)}/invites`,
        { method: "POST", body: JSON.stringify(body) });
      out.innerHTML = "";
      const box = el("div", "card");
      box.style.background = "var(--inset)";
      box.appendChild(el("label", null, `Invite for ${inv.sub} — copy it now, it will not be shown again`));

      // One-paste invite link: configures the recipient's app (server + auth mode + token).
      const link = `glyphio://join?server=${encodeURIComponent(window.location.origin)}&mode=token&token=${inv.token}`;
      const copyRow = (labelText, value, buttonText) => {
        const row = el("div", "row");
        row.style.marginBottom = "8px";
        const inp = el("input"); inp.readOnly = true; inp.value = value; inp.style.flex = "1";
        inp.className = "mono";
        inp.title = labelText;
        const b = el("button", null, buttonText);
        b.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(value); toast("Copied.", "ok"); }
          catch { inp.select(); document.execCommand("copy"); toast("Copied.", "ok"); }
        });
        row.appendChild(inp); row.appendChild(b);
        return row;
      };
      box.appendChild(copyRow("Raw token", inv.token, "Copy token"));
      box.appendChild(copyRow("Invite link", link, "Copy invite link"));
      box.appendChild(el("p", "hint",
        "The link configures the recipient's app in one paste — they can also paste it into Glyphio's 'I have an invite' box."));
      const loopback = ["127.0.0.1", "localhost", "[::1]"].includes(window.location.hostname);
      if (window.location.protocol === "http:" && !loopback) {
        const warn = el("p", "hint", "⚠ This server is being accessed over plain http — put it behind HTTPS before using invite links for real.");
        warn.style.color = "var(--danger)";
        box.appendChild(warn);
      }
      box.appendChild(el("p", "hint",
        `role: ${inv.role || "default"} · expires: ${inv.expiresAt ? new Date(inv.expiresAt).toLocaleDateString() : "never"} — the raw token also works in Glyphio's sync settings (auth mode: token).`));
      out.appendChild(box);
      sub.value = ""; email.value = ""; days.value = "";
      toast(`Invite created for ${inv.sub}.`, "ok");
    } catch (e) { toast("Invite failed: " + e.message, "err"); }
  });
  return wrap;
}

          aclWrap.appendChild(arow);

      const gbtn = el("button", null, "Grant");
      gbtn.addEventListener("click", async () => {
        const sv = gsub.value.trim();

        try {
          await api(`/admin/v1/teams/${encodeURIComponent(t.team)}/groups/${encodeURIComponent(g.id)}/acl/${encodeURIComponent(sv)}`,
            { method: "PUT", body: JSON.stringify({ level: glevel.value }) });

  return card;
}

async function collectPeople() {
  await refreshTeams();
  const results = await Promise.all(myTeams.map(async t => {
    const [mem, rows] = await Promise.all([
      api(`/v1/teams/${encodeURIComponent(t.team)}/members`).catch(() => ({ members: [] })),
      api(`/admin/v1/teams/${encodeURIComponent(t.team)}/roles`).catch(() => []),
    ]);
    return { team: t.team, mem: mem.members, rows };
  }));
  const people = new Map();
  for (const r of results) {
    const roleBySub = new Map(r.rows.map(x => [x.sub, x.role]));
    for (const m of r.mem) {
      const p = people.get(m.sub) || { sub: m.sub, email: m.email, lastSeen: m.lastSeen, teams: [] };
      p.email = p.email || m.email;
      if (m.lastSeen && (!p.lastSeen || m.lastSeen > p.lastSeen)) p.lastSeen = m.lastSeen;
      p.teams.push({ team: r.team, role: roleBySub.get(m.sub) || "default" });
      people.set(m.sub, p);
    }
    for (const [sub, role] of roleBySub) {
      if (!people.has(sub)) people.set(sub, { sub, teams: [{ team: r.team, role }] });
      else if (!people.get(sub).teams.some(x => x.team === r.team))
        people.get(sub).teams.push({ team: r.team, role });
    }
  }
  return people;
}

  async function load() {
    holder.innerHTML = "";
    holder.appendChild(el("div", "spin", "Loading…"));
    try {
      const q = new URLSearchParams({ limit: n.value });
      if (sel.value) q.set("team", sel.value);
      if (action.value.trim()) q.set("action", action.value.trim());
      if (actor.value.trim()) q.set("actor", actor.value.trim());
      loaded = await api(`/admin/v1/audit?${q}`);
      holder.innerHTML = "";
      holder.appendChild(auditTable(loaded));
    } catch (e) { holder.innerHTML = ""; holder.appendChild(el("p", "empty", "Failed: " + e.message)); }
  }
  go.addEventListener("click", load);
  [action, actor].forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") load(); }));
  csv.addEventListener("click", () => {
    if (!loaded.length) return toast("Load some entries first.", "err");
    const head = ["ts", "actor", "action", "team", "target", "detail"];
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const body = loaded.map(e => head.map(k => cell(e[k])).join(",")).join("\n");
    const blob = new Blob([head.join(",") + "\n" + body], { type: "text/csv" });
    const a = el("a");
    a.href = URL.createObjectURL(blob);
    a.download = `glyphio-audit-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
  load();
}

function auditTable(entries) {
  const table = el("table");
  table.innerHTML = `<thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Team</th><th>Target</th><th>Detail</th></tr></thead>`;
  const tb = el("tbody");
  for (const e of entries) {
    const tr = el("tr");
    tr.innerHTML = `
      <td class="dimmer">${new Date(e.ts).toLocaleString()}</td>
      <td class="strong">${esc(e.actor)}</td>
      <td><span class="pill">${esc(e.action)}</span></td>
      <td class="dim">${esc(e.team || "—")}</td>
      <td class="dim">${esc(e.target || "—")}</td>
      <td class="dimmer">${esc(e.detail || "")}</td>`;
    tb.appendChild(tr);
  }
  if (!entries.length) tb.innerHTML = `<tr><td colspan="6" class="empty">No entries.</td></tr>`;
  table.appendChild(tb);
  return table;
}
</script>
</body>
</html>
