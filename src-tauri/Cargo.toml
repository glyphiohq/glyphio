[package]
name = "glyphio"
version = "1.2.4"
description = "Glyphio desktop app (Tauri shell)"
edition = "2021"
license = "GPL-3.0-or-later"
default-run = "glyphio"

[lib]
name = "glyphio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"

snippet-store = { path = "crates/snippet-store" }
sync-client = { path = "crates/sync-client" }
sync-proto = { path = "crates/sync-proto" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tokio = { version = "1", features = ["time", "net", "io-util", "sync"] }
thiserror = "1"
log = "0.4"
dirs = "5"
base64 = "0.22"
url = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# Scrolling capture streams its rows into a PNG of unknown height (`capture/scroll/png_stream.rs`).
# Both are already in the tree through `png`.
flate2 = "1"
crc32fast = "1"
# The capture banner is drawn natively with the bundled Inter (`capture/banner.rs`).
ab_glyph = "0.2"
chrono-tz = "0.10"
tauri-plugin-updater = "2.10.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }

# macOS only: the platform layer (`src/platform/macos`) is the one place these are used, and
# other targets build against `src/platform/unsupported.rs` instead.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_15_2"] }
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
libc = "0.2"
# NSWorkspace only, to ask macOS which app is frontmost (the window list can't answer that
# reliably across displays, and the system-wide accessibility element refuses to).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSResponder", "NSPasteboard", "NSImage"] }
# The native login item (`SMAppService.mainApp`) and the launch Apple event that says whether
# we were started by logging in. No scripting, no LaunchAgent plist.
objc2 = "0.6"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSError", "objc2-core-services", "NSData", "NSArray", "NSString", "NSDate", "NSFormatter", "NSDateFormatter", "NSLocale", "NSTimeZone"] }

[features]
# macOS diagnostics that call the OS directly (`src/platform/macos/probes`). Off by default so
# other targets never try to build them; the macOS CI job turns it on.
macos-probes = []

[[example]]
name = "ax_windows"
path = "src/platform/macos/probes/ax_windows.rs"
required-features = ["macos-probes"]

[[example]]
name = "drag_region"
path = "src/platform/macos/probes/drag_region.rs"
required-features = ["macos-probes"]

[[example]]
name = "press_hotkey"
path = "src/platform/macos/probes/press_hotkey.rs"
required-features = ["macos-probes"]

[[example]]
name = "rect_probe"
path = "src/platform/macos/probes/rect_probe.rs"
required-features = ["macos-probes"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

[workspace]
members = ["crates/snippet-store", "crates/sync-proto", "crates/sync-client"]
