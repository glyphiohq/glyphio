[package]
name = "glyphio"
version = "1.1.1"
description = "Glyphio desktop app (Tauri shell)"
edition = "2021"
license = "GPL-3.0-or-later"
default-run = "glyphio"

[lib]
name = "glyphio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"

snippet-store = { path = "crates/snippet-store" }
sync-client = { path = "crates/sync-client" }
sync-proto = { path = "crates/sync-proto" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tokio = { version = "1", features = ["time", "net", "io-util", "sync"] }
thiserror = "1"
log = "0.4"
dirs = "5"
base64 = "0.22"
url = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
screencapturekit = { version = "8", features = ["macos_15_2"] }
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
# NSWorkspace only, to ask macOS which app is frontmost (the window list can't answer that
# reliably across displays, and the system-wide accessibility element refuses to).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSResponder", "NSPasteboard"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/snippet-store", "crates/sync-proto", "crates/sync-client"]
