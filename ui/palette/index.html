<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glyphio Search</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    /* Spotlight-style palette: a floating card on a fully transparent window. */
    html, body {
      background: transparent !important;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .palette {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .pal-search {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .pal-glyph {
      font-family: "SF Mono", "Roboto Mono", monospace;
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
    }
    #q {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 18px;
      font-family: inherit;
    }
    #q::placeholder { color: var(--text-muted); }
    .pal-list {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 6px;
      list-style: none;
    }
    .pal-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .pal-row.active { background: var(--accent-ghost); }
    .pal-trigger {
      font-family: "SF Mono", "Roboto Mono", monospace;
      font-size: 13px;
      color: var(--accent);
      white-space: nowrap;
    }
    .pal-preview {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pal-tag {
      font-size: 10px;
      color: var(--text-muted);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
    }
    /* Capture actions read as commands: a leading icon, plain label, brass on active. */
    .pal-ico {
      display: inline-flex;
      color: var(--text-muted);
      flex: 0 0 auto;
    }
    .pal-row.active .pal-ico { color: var(--accent); }
    .pal-action-label { color: var(--text); flex: 1; }
    .pal-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .pal-foot {
      display: flex;
      gap: 14px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
    }
    .pal-foot kbd {
      font-family: "SF Mono", "Roboto Mono", monospace;
      font-size: 10px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0 4px;
      color: var(--text-secondary);
    }
    .pal-foot .spacer { flex: 1; }
  </style>
</head>
<body>
  <div class="palette">
    <div class="pal-search">
      <span class="pal-glyph">⌁</span>
      <input id="q" type="text" placeholder="Search snippets and capture actions…" autocomplete="off" spellcheck="false">
    </div>
    <ul class="pal-list" id="list"></ul>
    <div class="pal-foot">
      <span><kbd>↩</kbd> insert into the active app</span>
      <span><kbd>⌘↩</kbd> copy</span>
      <span class="spacer"></span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
  <script type="module" src="palette.js"></script>
</body>
</html>
