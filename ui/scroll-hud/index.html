<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capturing</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    /* One pill beside a running scrolling capture: what it's up to, and how to end it. */
    html, body { background: transparent !important; margin: 0; height: 100%; overflow: hidden; }
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      display: flex;
      align-items: center;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      padding: 0 13px;
      height: 38px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border: 1px solid var(--border-strong);
      border-radius: 19px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font: 400 12px/1 var(--font-sans);
      color: var(--text-secondary);
    }

    /* A brass ring that turns while frames are being taken, and stills when paused. */
    .ring {
      flex: 0 0 auto;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--accent-ring);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.paused .ring { animation: none; border-color: var(--text-muted); }
    body.done .ring { animation-duration: 0.3s; }

    #label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #label b { color: var(--text); font-weight: 500; }
    #n {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* A reminder, not a control: Esc is the only way to stop a capture, so there is nothing
       here to click. `flex: 0 0 auto` beside the label's `flex: 1` means the state text
       ellipsises long before the hint is squeezed — whatever the font measures out at. */
    #hint {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }
    #hint kbd {
      font: 400 10px/1 var(--font-mono);
      color: var(--text-muted);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <div class="pill">
    <span class="ring"></span>
    <span id="label">Capturing…</span>
    <span id="hint"><kbd>esc</kbd> to stop</span>
  </div>
  <script>
    const { listen } = window.__TAURI__.event;
    const label = document.getElementById('label');

    // Measured, not guessed: the `esc to stop` hint is 74.2px, leaving a 138.8px label track,
    // and the longest string here ("Paused · pointer away") is 123.6px. Every state fits on one
    // line with ~15px to spare — and if a future font disagrees, the label ellipsises rather
    // than the pill overflowing.
    const draw = ({ frames, paused }) => {
      label.innerHTML = paused
        ? 'Paused <b>·</b> pointer away'
        : `Capturing <span id="n">${frames}</span> ${frames === 1 ? 'frame' : 'frames'}`;
      document.body.classList.toggle('paused', !!paused);
    };

    // This window is parked off screen between captures rather than closed, so each capture
    // starts by putting it back the way it was found.
    listen('scroll-begin', () => {
      document.body.className = '';
      label.textContent = 'Capturing…';
    });
    listen('scroll-progress', (e) => { if (!document.body.classList.contains('done')) draw(e.payload); });

    // Esc is handled in Rust (it is a global shortcut for the length of the capture), which
    // then says so here — stitching a tall image takes a moment, and in that moment the frame
    // count would otherwise sit there as if nothing had happened.
    listen('scroll-stopping', () => {
      document.body.classList.add('done');
      document.body.classList.remove('paused');
      label.textContent = 'Finishing…';
    });
  </script>
</body>
</html>
